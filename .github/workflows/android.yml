name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'favicon.svg'
      - 'manifest.webmanifest'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'apple-touch-icon.png'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -path '*/cmdline-tools/*/bin/sdkmanager' -print -quit)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_SDK_ROOT" -path '*/build-tools/35.0.0/aapt' -print -quit)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT" -path '*/build-tools/35.0.0/apksigner' -print -quit)"
          "$AAPT" dump badging "$APK" | head -n 25
          "$APKSIGNER" verify --verbose "$APK" | head -n 12
          sha256sum "$APK" | tee "$APK.sha256"
          cp "$APK" yiyu-focus-android.apk
          sha256sum yiyu-focus-android.apk > yiyu-focus-android.apk.sha256
          ls -lh "$APK" yiyu-focus-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yiyu-focus-android
          path: |
            yiyu-focus-android.apk
            yiyu-focus-android.apk.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="yiyu-focus-android.apk"
          TAG="android-v1.0.0"
          NOTES=$(cat <<'EOF'
          Android 独立安装包（APK），内置全部页面资源，打开不经过浏览器地址栏，断网也能用。

          - 适用：Android 10 及以上
          - 安装：下载 APK 后，在手机上允许“安装未知应用”，再点击安装
          - 数据：首次打开是干净数据；从网页版导出备份后，可在 App 的「数据与备份」中导入
          - iPhone：继续使用 Safari「添加到主屏幕」的 PWA 方式

          这是一个可直接侧载的 debug 签名构建；未上架 Google Play。
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" \
              "$APK" "$APK.sha256" \
              --title "一隅专注 Android v1.0.0" \
              --notes "$NOTES"
          fi